services:
  postgresql:
    container_name: banco_hotel
    image: postgres:17
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: reservaHotel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hotel-net
  rustfs:
    container_name: rustfs
    image: rustfs/rustfs:latest
    restart: unless-stopped
    ports:
      - "9003:9000"
      - "9005:9001"
    env_file:
      - rustfs.env
    volumes:
      - hotel_files_rustfs_volume:/data
    networks:
      - hotel-net
  adminer:
    image: adminer:latest
    container_name: hotel_adminer
    ports:
      - "6767:8080"
    depends_on:
      - postgresql
    networks:
      - hotel-net


networks:
  hotel_files_rustfs_stack:
  hotel-net:
    driver: bridge

volumes:
  postgres_data:
  hotel_files_rustfs_volume: