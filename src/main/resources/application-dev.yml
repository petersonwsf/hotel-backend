server:
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

spring:
  servlet:
    multipart:
      resolve-lazily: true
  datasource:
    url: jdbc:postgresql://localhost:5432/reservaHotel
    username: root
    password: root
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false
  mvc:
    problemdetails:
      enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    exchange: hotel_exchange
    queue: reservation_queue

minio:
  url: http://localhost:9003
  accessKey: minio_hotel_root_user
  secretKey: minio_hotel_root_password
  bucket: hotelfiles

logging:
  level:
    org:
      hibernate:
        orm:
          jdbc:
            bind: TRACE
        SQL: DEBUG

api:
  security:
    token:
      secret: secret_token